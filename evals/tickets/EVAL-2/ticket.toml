# R19 eval ticket 2: a new feature whose symbol doesn't exist yet.
key = "EVAL-2"
kind = "feature_missing_symbol"
title = "Add initials() to toy.textutil"
description = """
Add a function `initials(name: str) -> str` to `toy/textutil.py` that returns the upper-case
first letter of each word in a name. Words are separated by whitespace.

## Acceptance criteria

- [ ] `initials("ada lovelace")` returns `"AL"`
- [ ] `initials("  grace   brewster hopper ")` returns `"GBH"`
- [ ] `initials("")` returns `""`
- [ ] `shout` and `word_count` keep working as before
"""

# In scope (R33): the ticket asks for the first letter of each word, while the obvious
# implementation (`word[0]`, which the T11 baseline writer wrote) takes the first character.
[feedback]
source = "coderabbit"
path = "toy/textutil.py"
line = 1
body = """
**First letter, not first character.** The ticket asks for the first *letter* of each word, but
`initials` takes each word's first character, so punctuation leaks into the result:
`initials("ada (byron) lovelace")` returns `"A(L"` instead of `"ABL"`, and
`initials('"grace" hopper')` returns `'"H'` instead of `"GH"`. Use the first letter of each
word, and let a word with no letters at all add nothing: `initials("ada & grace")` should
return `"AG"`.
"""

[expected]
red_first = "missing_symbol"
address = ["fixed"]
