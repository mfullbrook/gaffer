[project]
name = "gaffer"
version = "0.1.0"
description = "Overnight pair: a Codex tester and a Claude writer, supervised by gaffer"
authors = [
    { name = "Mark Fullbrook", email = "mark@fullbrook.me" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
gaffer = "gaffer:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
